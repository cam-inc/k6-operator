---
name: Helm Lint
on:
  # `ct lint` does not work well with tag references on releases.
  # OTOH, Helm linting on tags is not necessary so long as it
  # happens on push to branches.
  push:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@18bc76811624f360dbd7f18c2d4ecb32c7b87bab # v1
        with:
          version: v3.7.2

      - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: 3.7

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6b64532d456fa490a3da177fbd181ac4c8192b58 # v2.2.0

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.ref_name }} --config ./charts/ct.yaml
